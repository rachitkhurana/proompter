<style id="host-css">
/* Mock Gamorite page, rendered inside the frame Proompter reviews. */
html,body{margin:0;background:#0c0e13}
.h-root{--h-bg:#0c0e13;--h-surface:#141720;--h-raised:#1a1e29;--h-line:#242938;--h-fg:#e8eaf0;--h-muted:#8a90a2;--h-brand:#7c5cff;--h-live:#ff4d6d;--h-ok:#3ecf8e;background:var(--h-bg);color:var(--h-fg);font:14px/1.5 "Geist",ui-sans-serif,system-ui,sans-serif;min-height:100vh}
.h-root *{box-sizing:border-box}
.h-app{display:grid;grid-template-columns:200px minmax(0,1fr) 280px;gap:20px;max-width:1280px;margin:0 auto;padding-block:20px 140px;padding-inline:16px}
.h-side{display:flex;flex-direction:column;gap:4px;position:sticky;top:20px;align-self:start}
.h-logo{font-weight:700;letter-spacing:-.02em;font-size:18px;padding:6px 10px 14px;display:flex;align-items:center;gap:8px}
.h-logo i{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--h-brand),#c06bff)}
.h-nav{display:flex;flex-direction:column;gap:2px}
.h-nav a{color:var(--h-muted);text-decoration:none;padding:8px 10px;border-radius:8px;display:flex;align-items:center;gap:10px}
.h-nav a.on{background:var(--h-raised);color:var(--h-fg)}
.h-nav a span{width:16px;height:16px;border-radius:4px;border:1.5px solid currentColor;opacity:.7;flex:none}
.h-voice{margin-top:14px;border:1px solid var(--h-line);background:var(--h-surface);border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px;font-size:13px}
.h-voice b{font-weight:600;display:block}.h-voice small{color:var(--h-muted)}
.h-eq{display:flex;gap:2px;align-items:flex-end;height:16px}
.h-eq i{width:3px;background:var(--h-ok);border-radius:2px;animation:h-eq 1s ease-in-out infinite}
.h-eq i:nth-child(2){animation-delay:.2s}.h-eq i:nth-child(3){animation-delay:.4s}
@keyframes h-eq{0%,100%{height:4px}50%{height:16px}}
.h-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.h-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.h-head h1{font-size:20px;margin:0;letter-spacing:-.02em}
.h-tabs{display:flex;gap:4px;background:var(--h-surface);border:1px solid var(--h-line);border-radius:10px;padding:3px}
.h-tabs button{all:unset;cursor:pointer;padding:5px 12px;border-radius:7px;color:var(--h-muted);font-size:13px}
.h-tabs button.on{background:var(--h-raised);color:var(--h-fg)}
.h-card{background:var(--h-surface);border:1px solid var(--h-line);border-radius:14px;padding:16px}
.h-compose{display:flex;gap:12px;align-items:center;color:var(--h-muted)}
.h-av{width:36px;height:36px;border-radius:50%;flex:none;background:linear-gradient(135deg,#ff8a5b,#ff4d6d)}
.h-av.b{background:linear-gradient(135deg,#52d1ff,#7c5cff)}.h-av.c{background:linear-gradient(135deg,#3ecf8e,#0ea5a5)}
.h-input{flex:1;min-width:0;background:var(--h-bg);border:1px solid var(--h-line);border-radius:10px;padding:10px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-post-top{display:flex;gap:10px;align-items:center}
.h-post-top small{color:var(--h-muted);display:block;font-size:12px}
.h-post p{margin:12px 0}
.h-media{aspect-ratio:16/8;max-width:100%;border-radius:10px;background:radial-gradient(120% 120% at 20% 10%,#3b2a7a 0,#141720 60%),#141720;display:flex;align-items:flex-end;padding:12px;font-weight:600;border:1px solid var(--h-line)}
.h-acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.h-acts button{all:unset;cursor:pointer;padding:6px 10px;border-radius:8px;color:var(--h-muted);font-size:13px;border:1px solid var(--h-line)}
.h-tour-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.h-live{display:inline-flex;align-items:center;gap:6px;color:var(--h-live);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.h-live i{width:8px;height:8px;border-radius:50%;background:var(--h-live);animation:h-pulse 1.4s ease-out infinite}
@keyframes h-pulse{0%{box-shadow:0 0 0 0 rgba(255,77,109,.6)}100%{box-shadow:0 0 0 10px rgba(255,77,109,0)}}
.h-tour h3{margin:6px 0 2px;font-size:16px}.h-tour small{color:var(--h-muted)}
.h-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;font-variant-numeric:tabular-nums}
.h-table th{color:var(--h-muted);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--h-line)}
.h-table td{padding:8px;border-bottom:1px solid var(--h-line)}
.h-table .num{text-align:right}
.h-skel{display:flex;flex-direction:column;gap:8px}
.h-skel i{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--h-raised) 0,#232838 50%,var(--h-raised) 100%);background-size:200% 100%;animation:h-shim 1.4s linear infinite}
.h-skel i:nth-child(2){width:70%}.h-skel i:nth-child(3){width:45%}
@keyframes h-shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
.h-rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:20px;align-self:start}
.h-rail h4{margin:0 0 10px;font-size:13px;color:var(--h-muted);font-weight:500}
.h-list{display:flex;flex-direction:column;gap:10px}
.h-row{display:flex;align-items:center;gap:10px;font-size:13px}
.h-row small{color:var(--h-muted);display:block}
.h-pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--h-line);color:var(--h-muted);white-space:nowrap}
.h-pill.lock{color:#ffb86b;border-color:#5a4126}
.pp-frozen *,.pp-frozen *::before,.pp-frozen *::after{animation-play-state:paused!important}
.pp-picking,.pp-picking *{cursor:crosshair!important}
@media (max-width:1100px){.h-app{grid-template-columns:180px minmax(0,1fr)}.h-rail{display:none}}
@media (max-width:760px){
  .h-app{grid-template-columns:minmax(0,1fr)}
  .h-side{position:fixed;inset:auto 0 0 0;z-index:5;flex-direction:row;align-items:center;background:var(--h-surface);border-top:1px solid var(--h-line);padding:8px}
  .h-logo,.h-voice{display:none}
  .h-nav{flex-direction:row;justify-content:space-around;width:100%}
  .h-nav a{font-size:0;padding:10px}.h-nav a span{width:20px;height:20px}
}
</style>

<style>
/* Proompter: a review layer that floats over the app being reviewed.
   Layout: a draggable dock, an anchored composer, a right-hand entries sheet with a ticket view, and a command menu.
   System: Geist on a 4px grid; materials get heavier as surfaces get bigger; one coral accent for action and selection. */
:root{
  color-scheme:dark;
  --canvas:#09090b;
  --mat-1:rgba(30,30,34,.72);   /* small floating chrome: dock, menus, tooltips */
  --mat-2:rgba(22,22,25,.86);   /* big surfaces: composer, sheet, command menu */
  --blur-1:blur(20px) saturate(1.8);
  --blur-2:blur(32px) saturate(1.9);
  --fill-1:rgba(255,255,255,.04);
  --fill-2:rgba(255,255,255,.07);
  --fill-3:rgba(255,255,255,.11);
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.12);
  --edge:inset 0 1px 0 rgba(255,255,255,.07);
  --fg:#f4f4f5;
  --fg-2:#a1a1aa;
  --fg-3:#8f8f98;
  --fg-4:#52525b;
  --acc:#ff6363;
  --acc-solid:#d63c3c;
  --acc-fg:#fff;
  --acc-press:#f25555;
  --acc-soft:rgba(255,99,99,.13);
  --acc-line:rgba(255,99,99,.4);
  --p-urgent:#ff5c5c;
  --p-high:#f5a524;
  --p-med:#a1a1aa;
  --ok:#3dd68c;
  --prog:#f5c84c;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.23,1,.32,1);
  --ease-io:cubic-bezier(.77,0,.175,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  --sh-1:0 0 0 1px var(--line-2),0 4px 12px -2px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.3);
  --sh-2:0 0 0 1px var(--line-2),0 16px 40px -8px rgba(0,0,0,.6),0 4px 10px -4px rgba(0,0,0,.4);
  --sh-3:0 0 0 1px var(--line-2),0 32px 80px -16px rgba(0,0,0,.75),0 8px 20px -8px rgba(0,0,0,.45);
}
@media (prefers-reduced-transparency:reduce){:root{--mat-1:#1e1e22;--mat-2:#161619;--blur-1:none;--blur-2:none}}
@media (prefers-contrast:more){:root{--line:rgba(255,255,255,.18);--line-2:rgba(255,255,255,.28);--fg-2:#d4d4d8;--fg-3:#a1a1aa}}

html,body{height:100%}
body{background:var(--canvas);margin:0;overflow:hidden}
.pp,.pp *{box-sizing:border-box}
.pp{font:400 13px/20px var(--sans);letter-spacing:-.003em;color:var(--fg);-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
.pp button{font:inherit;color:inherit;letter-spacing:inherit}
.pp :focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
kbd{font:500 10.5px/16px var(--mono);color:var(--fg-2);background:var(--fill-2);border-radius:4px;padding:0 4px;min-width:16px;text-align:center;display:inline-block;box-shadow:inset 0 -1px 0 rgba(0,0,0,.35)}
.ic{width:16px;height:16px;flex:none;stroke-width:1.75}
.ic.s{width:14px;height:14px}
.ic.xs{width:12px;height:12px}

/* ---------- stage ---------- */
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(80% 60% at 50% 40%,#131316 0,var(--canvas) 70%)}
.stage.device{padding:72px 32px 104px}
body.dock-v .stage.device{padding:56px 104px}
.dwrap{position:relative;flex:none;transition:width .45s var(--ease-drawer),height .45s var(--ease-drawer)}
.stage:not(.device) .dwrap{width:100%!important;height:100%!important}
.stage.device .dwrap{background:#000;border-radius:var(--br,20px);padding:var(--bz,8px);box-shadow:0 0 0 1px rgba(255,255,255,.09),inset 0 0 0 1px rgba(255,255,255,.04),0 50px 100px -30px rgba(0,0,0,.9)}
.dclip{width:100%;height:100%;overflow:hidden;border-radius:var(--cr,0)}
.dclip iframe{border:0;display:block;transform-origin:0 0;background:#0c0e13}
.stage:not(.device) .dclip iframe{width:100%;height:100%}
.devcap{position:absolute;left:50%;bottom:64px;translate:-50% 0;display:flex;gap:8px;align-items:center;font-size:12px;line-height:16px;color:var(--fg-3);white-space:nowrap}
body.dock-v .devcap{bottom:20px}
.devcap b{color:var(--fg-2);font-weight:500}
.devcap .dot{width:3px;height:3px;border-radius:50%;background:var(--fg-4)}

/* ---------- overlay: hover, selection, pins ---------- */
.ovl{position:fixed;inset:0;pointer-events:none;z-index:40}
.hov{position:fixed;border-radius:6px;box-shadow:0 0 0 1.5px var(--acc),0 0 0 4px var(--acc-soft);background:rgba(255,99,99,.06);opacity:0;transition:opacity .12s var(--ease),left .09s var(--ease),top .09s var(--ease),width .09s var(--ease),height .09s var(--ease)}
.hov.on{opacity:1}
.hlab{position:fixed;display:flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;background:var(--acc-solid);color:var(--acc-fg);font:500 11.5px/16px var(--sans);white-space:nowrap;opacity:0;translate:0 2px;transition:opacity .12s var(--ease),translate .15s var(--ease)}
.hlab.on{opacity:1;translate:0 0}
.hlab .mono{font-size:10.5px;opacity:.8}
.selb{position:fixed;border-radius:6px;box-shadow:0 0 0 1.5px var(--acc);background:var(--acc-soft)}
.selb b{position:absolute;top:-8px;left:-8px;width:18px;height:18px;border-radius:50%;background:var(--acc-solid);color:var(--acc-fg);font:600 10px/18px var(--sans);text-align:center;box-shadow:0 0 0 2px var(--canvas)}
.catch{position:fixed;z-index:45;cursor:crosshair;pointer-events:auto}
.drag{position:fixed;z-index:46;border-radius:4px;box-shadow:0 0 0 1.5px var(--acc);background:var(--acc-soft);pointer-events:none}
.pin{position:fixed;pointer-events:auto;width:24px;height:24px;margin:-12px 0 0 -12px;padding:0;border:0;border-radius:12px 12px 12px 3px;display:grid;place-items:center;color:#fff;font:600 10.5px/1 var(--sans);cursor:pointer;box-shadow:0 0 0 2px rgba(9,9,11,.9),0 6px 14px -2px rgba(0,0,0,.55);transition:scale .16s var(--ease);animation:pin-in .32s var(--ease) both}
.pin:active{scale:.94}
.pin.urgent{background:var(--p-urgent)}.pin.high{background:#d4891a}.pin.med{background:#52525b}.pin.done{background:#27272a;color:var(--fg-3)}
.pin.pulse::after{content:"";position:absolute;inset:-2px;border-radius:inherit;box-shadow:0 0 0 0 var(--acc-line);animation:ring .9s var(--ease) 2}
.pin .card{position:absolute;left:18px;top:-6px;width:248px;padding:10px 12px;border-radius:12px;background:var(--mat-1);backdrop-filter:var(--blur-1);-webkit-backdrop-filter:var(--blur-1);box-shadow:var(--sh-2),var(--edge);text-align:left;color:var(--fg);opacity:0;scale:.96;transform-origin:0 12px;transition:opacity .14s var(--ease),scale .18s var(--ease);pointer-events:none}
.pin .card b{display:block;font:500 13px/18px var(--sans)}
.pin .card span{display:flex;gap:6px;align-items:center;margin-top:4px;font:400 11.5px/16px var(--sans);color:var(--fg-3)}
@media (hover:hover){.pin:hover .card{opacity:1;scale:1}}
.pin:focus-visible .card{opacity:1;scale:1}
@keyframes pin-in{from{opacity:0;scale:.6}to{opacity:1;scale:1}}
@keyframes ring{to{box-shadow:0 0 0 12px transparent}}

/* ---------- atoms ---------- */
.ib{all:unset;cursor:pointer;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--fg-2);position:relative;transition:background-color .12s var(--ease),color .12s var(--ease),scale .12s var(--ease)}
@media (hover:hover){.ib:hover{background:var(--fill-2);color:var(--fg)}}
.ib:active{scale:.94}
.ib.on{background:var(--acc-soft);color:var(--acc)}
.ib[aria-disabled="true"]{opacity:.35;pointer-events:none}
.ib .badge{position:absolute;top:2px;right:2px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--acc-solid);color:var(--acc-fg);font:600 9.5px/15px var(--sans);text-align:center;box-shadow:0 0 0 2px #1d1d21}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;font:500 12.5px/1 var(--sans);color:var(--fg);background:var(--fill-2);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap;transition:background-color .12s var(--ease),scale .12s var(--ease)}
@media (hover:hover){.btn:hover{background:var(--fill-3)}}
.btn:active{scale:.97}
.btn.pri{background:var(--acc-solid);color:var(--acc-fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px rgba(0,0,0,.3)}
@media (hover:hover){.btn.pri:hover{background:#cc3b3b}}
.btn.pri:active{background:#c23636}
.btn.ghost{background:transparent;box-shadow:none;color:var(--fg-2)}
@media (hover:hover){.btn.ghost:hover{background:var(--fill-2);color:var(--fg)}}
.btn.sm{height:26px;padding:0 9px;font-size:12px;border-radius:7px}
.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.btn kbd{background:rgba(255,255,255,.16);color:inherit;box-shadow:none}
.chip{all:unset;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:7px;font:400 12px/16px var(--sans);color:var(--fg-2);box-shadow:inset 0 0 0 1px var(--line-2);white-space:nowrap;max-width:100%}
button.chip{cursor:pointer;transition:background-color .12s var(--ease),color .12s var(--ease)}
@media (hover:hover){button.chip:hover{background:var(--fill-2);color:var(--fg)}}
.chip.mono{font:400 11.5px/16px var(--mono)}
.chip.acc{color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc-line)}
.chip.ghost{box-shadow:none;color:var(--fg-3)}
.chip>span{overflow:hidden;text-overflow:ellipsis}
.prio{display:inline-flex;align-items:flex-end;gap:1.5px;width:14px;height:14px;padding:1px;flex:none}
.prio i{width:3px;border-radius:1px;background:var(--fg-3)}
.prio i:nth-child(1){height:5px}.prio i:nth-child(2){height:8px}.prio i:nth-child(3){height:11px}
.prio.high i{background:var(--p-high)}
.prio.med i:nth-child(3){opacity:.3}
.prio.urgent{display:grid;place-items:center;border-radius:3px;background:var(--p-urgent);color:#fff;font:700 9px/1 var(--sans)}
.st{width:14px;height:14px;flex:none;display:inline-grid;place-items:center}
.st i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--fg-3);display:block;position:relative}
.st.progress i{box-shadow:inset 0 0 0 1.5px var(--prog);background:conic-gradient(var(--prog) 0 50%,transparent 50%) content-box;padding:3px}
.st.resolved i{background:var(--ok);box-shadow:none}
.st.resolved i::after{content:"";position:absolute;left:4px;top:2px;width:3px;height:6px;border:solid #0b0b0c;border-width:0 1.5px 1.5px 0;rotate:45deg}
.tip{position:relative}
.tip::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:50%;translate:-50% 2px;white-space:nowrap;height:24px;display:flex;align-items:center;gap:6px;padding:0 8px;border-radius:6px;background:var(--mat-1);backdrop-filter:var(--blur-1);-webkit-backdrop-filter:var(--blur-1);box-shadow:var(--sh-1),var(--edge);color:var(--fg);font:500 11.5px/1 var(--sans);opacity:0;pointer-events:none;transition:opacity .12s var(--ease) .35s,translate .12s var(--ease) .35s}
.dock.warm .tip::after{transition-delay:0s,0s;transition-duration:0s}
@media (hover:hover){.tip:hover::after{opacity:1;translate:-50% 0}}
.dock.below .tip::after{bottom:auto;top:calc(100% + 10px)}
.dock.v.edge-l .tip::after{left:calc(100% + 10px);top:50%;bottom:auto;translate:2px -50%}
.dock.v.edge-r .tip::after{left:auto;right:calc(100% + 10px);top:50%;bottom:auto;translate:-2px -50%}
@media (hover:hover){.dock.v .tip:hover::after{translate:0 -50%}}

/* ---------- dock ---------- */
.dock{position:fixed;left:50%;bottom:20px;translate:-50% 0;z-index:60;display:flex;align-items:center;gap:2px;padding:5px;border-radius:16px;background:var(--mat-1);backdrop-filter:var(--blur-1);-webkit-backdrop-filter:var(--blur-1);box-shadow:var(--sh-2),var(--edge);touch-action:none;user-select:none}
.dock.free{translate:none;bottom:auto}
.dock.settling{transition:left .42s var(--ease-drawer),top .42s var(--ease-drawer)}
.dock.dragging{box-shadow:var(--sh-3),var(--edge);cursor:grabbing}
.dock.intro{animation:dock-in .45s var(--ease) both}
@keyframes dock-in{from{opacity:0;translate:-50% 12px;scale:.97}}
.tw{display:grid;grid-template-columns:1fr;transition:grid-template-columns .32s var(--ease-drawer),opacity .2s var(--ease)}
.tw-in{display:flex;align-items:center;gap:2px;min-width:0;overflow:hidden}
.dock.v .tw{grid-template-columns:none;grid-template-rows:1fr;transition:grid-template-rows .32s var(--ease-drawer),opacity .2s var(--ease)}
.dock.v .tw-in{flex-direction:column;min-height:0}
.dock.col .tw{grid-template-columns:0fr;opacity:0}
.dock.v.col .tw{grid-template-rows:0fr}
.dock.col .tw-in{visibility:hidden;transition:visibility 0s .32s}
.nm-w{display:grid;grid-template-columns:1fr;transition:grid-template-columns .32s var(--ease-drawer),opacity .2s var(--ease)}
.nm-w .nm{overflow:hidden;white-space:nowrap;min-width:0}
.dock.col .nm-w{grid-template-columns:0fr;opacity:0}
.dock.col .brand{gap:0;padding:0 4px}
.brand{border-radius:10px;transition:background-color .12s var(--ease),gap .32s var(--ease-drawer),padding .32s var(--ease-drawer)}
@media (hover:hover){.brand:hover{background:var(--fill-2)}}
.brand:active .logo{scale:.92}
.logo{transition:scale .12s var(--ease)}
.lbadge{min-width:16px;height:16px;padding:0 4px;margin-left:6px;border-radius:8px;background:var(--fill-3);color:var(--fg);font:600 10px/16px var(--sans);text-align:center}
.dock .sep{width:1px;height:20px;background:var(--line-2);margin:0 4px;flex:none}
.grip{all:unset;cursor:grab;width:16px;height:30px;display:grid;place-items:center;color:var(--fg-4);border-radius:6px;transition:color .12s var(--ease)}
@media (hover:hover){.grip:hover{color:var(--fg-2)}}
.brand{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px 0 4px;font:600 13px/1 var(--sans);letter-spacing:-.01em;cursor:grab}
.logo{width:20px;height:20px;border-radius:6px;background:linear-gradient(180deg,#ff7a7a,#ff5050);color:#fff;display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 2px rgba(0,0,0,.4)}
.logo svg{width:12px;height:12px;stroke-width:2.4}
.seg{display:flex;gap:2px;padding:2px;border-radius:10px;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 1px var(--line)}
.seg .ib{width:28px;height:26px;border-radius:7px}
.seg .ib.on{background:var(--fill-3);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.35),var(--edge)}
.dock.v{flex-direction:column;padding:5px}
.dock.v .sep{width:20px;height:1px;margin:4px 0}
.dock.v .seg{flex-direction:column}
.dock.v .nm-w{display:none}
.brand{position:relative}
.dock.v .brand{height:30px}
.dock.v .lbadge{position:absolute;top:-4px;right:-6px;margin:0;min-width:16px;height:16px;padding:0 4px;background:var(--acc-solid);color:var(--acc-fg);font-size:9.5px;line-height:16px;box-shadow:0 0 0 2px #1d1d21}
.dock.v .brand{padding:0;width:30px;justify-content:center}
.dock.v .grip{width:30px;height:16px}
.dock.v .grip svg{rotate:90deg}
.subbar{position:fixed;z-index:61;display:flex;align-items:center;gap:8px;height:42px;padding:0 6px 0 14px;border-radius:14px;background:var(--mat-1);backdrop-filter:var(--blur-1);-webkit-backdrop-filter:var(--blur-1);box-shadow:var(--sh-2),var(--edge);font:500 12.5px/1 var(--sans);transition:opacity .16s var(--ease),scale .16s var(--ease)}
.subbar[hidden]{display:flex!important;opacity:0;scale:.96;pointer-events:none}

/* ---------- surfaces ---------- */
.surface{background:var(--mat-2);backdrop-filter:var(--blur-2);-webkit-backdrop-filter:var(--blur-2);box-shadow:var(--sh-3),var(--edge);border-radius:16px}
.scrim{position:fixed;inset:0;z-index:84;background:rgba(0,0,0,.32);opacity:0;transition:opacity .2s var(--ease);pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}

/* composer */
.comp{position:fixed;z-index:90;width:min(500px,calc(100vw - 24px));display:flex;flex-direction:column;max-height:calc(100vh - 24px);opacity:0;scale:.96;transition:opacity .16s var(--ease),scale .2s var(--ease);pointer-events:none}
.comp.on{opacity:1;scale:1;pointer-events:auto}
.comp-hd{display:flex;align-items:center;gap:8px;padding:12px 12px 0 16px}
.target{display:flex;align-items:center;gap:8px;min-width:0;flex:1;font:500 12px/16px var(--sans);color:var(--fg-2)}
.target .ti{width:22px;height:22px;border-radius:6px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex:none}
.target .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comp-bd{padding:12px 16px 4px;display:grid;gap:4px;overflow:auto}
.in-title{all:unset;width:100%;font:600 16px/24px var(--sans);letter-spacing:-.012em;color:var(--fg)}
.in-title::placeholder{color:var(--fg-3)}
.in-desc{all:unset;width:100%;min-height:60px;font:400 13.5px/21px var(--sans);color:var(--fg-2);white-space:pre-wrap}
.in-desc::placeholder{color:var(--fg-3)}
.err{font:400 12px/16px var(--sans);color:var(--p-urgent)}
.quote{margin:2px 0 6px;padding:2px 0 2px 12px;box-shadow:inset 2px 0 0 var(--acc);color:var(--fg-2);font-style:italic}
.props{display:flex;flex-wrap:wrap;gap:6px}
.comp .props{padding:8px 16px 14px}
.ctx{box-shadow:inset 0 1px 0 var(--line)}
.ctx summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;font:400 12px/16px var(--sans);color:var(--fg-3);transition:color .12s var(--ease)}
.ctx summary::-webkit-details-marker{display:none}
@media (hover:hover){.ctx summary:hover{color:var(--fg-2)}}
.ctx summary .car{margin-left:auto;transition:rotate .2s var(--ease)}
.ctx[open] summary .car{rotate:90deg}
.ctx .bad{color:var(--p-urgent)}
.ctx-in{padding:0 16px 14px;display:grid;gap:12px}
.comp-ft{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;box-shadow:inset 0 1px 0 var(--line)}
.comp-ft .hint{margin-right:auto}
.hint{display:inline-flex;align-items:center;gap:6px;font:400 12px/16px var(--sans);color:var(--fg-3)}
.lbl{font:500 11px/16px var(--sans);color:var(--fg-3);letter-spacing:.01em}
.log{display:grid;gap:2px;font:400 11px/18px var(--mono);color:var(--fg-2)}
.log div{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;min-width:0}
.log span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log .e{color:var(--p-urgent)}.log .w{color:var(--p-high)}.log .g{color:var(--ok)}.log .m{color:var(--fg-3)}

/* menu */
.menu{position:fixed;z-index:120;min-width:200px;max-width:280px;padding:4px;border-radius:12px;background:var(--mat-1);backdrop-filter:var(--blur-1);-webkit-backdrop-filter:var(--blur-1);box-shadow:var(--sh-2),var(--edge);opacity:0;scale:.96;transition:opacity .14s var(--ease),scale .16s var(--ease)}
.menu.on{opacity:1;scale:1}
.menu .mh{padding:6px 8px 4px;font:500 11px/16px var(--sans);color:var(--fg-3)}
.menu button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:7px;font:400 13px/1 var(--sans);color:var(--fg)}
.menu button.kb{background:var(--fill-2)}
.menu button .ck{margin-left:auto;color:var(--acc)}
.menu button kbd{margin-left:auto}

/* sheet */
.sheet{position:fixed;top:12px;bottom:12px;right:12px;z-index:70;width:min(460px,calc(100vw - 24px));display:flex;flex-direction:column;overflow:hidden;translate:calc(100% + 24px) 0;transition:translate .38s var(--ease-drawer),opacity .14s var(--ease)}
.sheet.left{right:auto;left:12px;translate:calc(-100% - 24px) 0}
.sheet.on{translate:0 0}
.sh-hd{display:flex;align-items:center;gap:10px;height:56px;padding:0 10px 0 16px;flex:none}
.sh-hd .t{flex:1;min-width:0}
.sh-hd .t b{display:block;font:600 13.5px/18px var(--sans);letter-spacing:-.008em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-hd .t span{display:block;font:400 11.5px/16px var(--mono);color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-tabs{display:flex;gap:2px;margin:0 12px 8px;padding:2px;border-radius:10px;background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 1px var(--line);flex:none}
.sh-tabs button{all:unset;cursor:pointer;flex:1;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:6px;font:500 12.5px/1 var(--sans);color:var(--fg-2);transition:background-color .15s var(--ease),color .15s var(--ease)}
.sh-tabs button.on{background:var(--fill-3);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.35),var(--edge)}
.sh-tabs .n{font:400 11.5px/1 var(--sans);color:var(--fg-3)}
.sh-bd{flex:1;overflow:auto;overscroll-behavior:contain;box-shadow:inset 0 1px 0 var(--line)}
.sh-ft{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;box-shadow:inset 0 1px 0 var(--line)}
.sh-ft .sp{flex:1}

/* list */
.grp{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;height:34px;padding:0 16px;font:500 12px/1 var(--sans);color:var(--fg-2);background:rgba(28,28,31,.92);backdrop-filter:blur(8px);box-shadow:inset 0 -1px 0 var(--line)}
.grp .n{color:var(--fg-3);font-weight:400}
.row{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:14px 52px 14px minmax(0,1fr) auto;align-items:center;gap:10px;height:40px;padding:0 16px;box-shadow:inset 0 -1px 0 var(--line);transition:background-color .1s var(--ease)}
@media (hover:hover){.row:hover{background:var(--fill-1)}}
.row.sel{background:var(--fill-2)}
.row .id{font:400 11.5px/1 var(--mono);color:var(--fg-3)}
.row .t{font:400 13px/20px var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.resolved .t{color:var(--fg-3)}
.row .r{display:flex;align-items:center;gap:8px;color:var(--fg-3);font:400 11.5px/1 var(--sans)}
.empty{display:grid;justify-items:center;gap:10px;padding:48px 24px;text-align:center;color:var(--fg-3);font:400 12.5px/18px var(--sans)}
.empty .ei{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--fill-2);color:var(--fg-2)}

/* ticket */
.tk{display:flex;flex-direction:column}
.tk-crumb{display:flex;align-items:center;gap:6px;height:44px;padding:0 10px 0 12px;font:400 12px/1 var(--sans);color:var(--fg-3);box-shadow:inset 0 -1px 0 var(--line);flex:none}
.tk-crumb b{color:var(--fg-2);font-weight:500}
.tk-crumb .sp{flex:1}
.tk-main{padding:20px 20px 4px;display:grid;gap:10px}
.tk-title{margin:0;font:600 18px/26px var(--sans);letter-spacing:-.016em;text-wrap:balance}
.tk-desc{margin:0;font:400 13.5px/22px var(--sans);color:var(--fg-2);max-width:62ch}
.tk-sec{padding:16px 20px;display:grid;gap:10px;box-shadow:inset 0 1px 0 var(--line)}
.tk-sec>h4{margin:0;display:flex;align-items:center;gap:8px;font:500 12px/16px var(--sans);color:var(--fg-3)}
.tk-sec>h4 .sp{flex:1}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);row-gap:2px;column-gap:12px;align-items:center}
.kv dt{font:400 12.5px/30px var(--sans);color:var(--fg-3)}
.kv dd{margin:0;min-width:0;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.kv .val{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 8px;margin-left:-8px;border-radius:7px;font:400 13px/1 var(--sans);color:var(--fg);max-width:calc(100% + 8px);transition:background-color .12s var(--ease)}
.kv .val.ro{cursor:default}
@media (hover:hover){.kv .val:not(.ro):hover{background:var(--fill-2)}}
.kv .val>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv .val.mono{font:400 12px/1 var(--mono)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font:400 12.5px/20px var(--sans);color:var(--fg-3)}
.crumbs span:last-child{color:var(--fg)}
.shot{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:10px;overflow:hidden;background:#0c0e13;box-shadow:inset 0 0 0 1px var(--line-2)}
.shot .pg{position:absolute;inset:10% 8%;border-radius:6px;background:#141720;box-shadow:inset 0 0 0 1px #242938;display:grid;grid-template-rows:14px 1fr 1fr;gap:6%;padding:5%}
.shot .pg i{border-radius:4px;background:#1a1e29}
.shot .pg i.hit{box-shadow:0 0 0 1.5px var(--acc),0 0 0 4px var(--acc-soft);background:#1f2230}
.snap{aspect-ratio:auto;height:180px;transition:height .25s var(--ease)}
.snap iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;pointer-events:none;opacity:0;transition:opacity .22s var(--ease)}
.snap iframe.ld{opacity:1}
.snap-hl{position:absolute;border-radius:4px;box-shadow:0 0 0 1.5px var(--acc),0 0 0 5px var(--acc-soft),0 0 0 9999px rgba(9,9,11,.28);pointer-events:none;opacity:0;transition:opacity .22s var(--ease) .08s}
.snap iframe.ld + .snap-hl{opacity:1}
.snap .mode{position:absolute;right:8px;top:8px;display:flex;gap:2px;padding:2px;border-radius:8px;background:rgba(9,9,11,.78);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px var(--line-2)}
.snap .mode button{all:unset;cursor:pointer;height:22px;padding:0 8px;border-radius:6px;font:500 11.5px/22px var(--sans);color:var(--fg-3)}
.snap .mode button.on{background:var(--fill-3);color:var(--fg)}
.snap-empty{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;color:var(--fg-3);font:400 12.5px/18px var(--sans);text-align:center;padding:16px}
.shot .cap{position:absolute;left:8px;bottom:8px;display:flex;gap:6px}
.shot .cap .chip{background:rgba(9,9,11,.8);backdrop-filter:blur(8px)}
.ctabs{display:flex;gap:2px}
.ctabs button{all:unset;cursor:pointer;height:24px;padding:0 8px;border-radius:6px;font:500 12px/1 var(--sans);color:var(--fg-3);display:flex;align-items:center;gap:6px}
.ctabs button.on{background:var(--fill-2);color:var(--fg)}
.ctabs .bad{color:var(--p-urgent);font-weight:400}
.act{display:grid;gap:0;position:relative}
.act div{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:start;padding:5px 0;font:400 12.5px/20px var(--sans);color:var(--fg-2)}
.act div b{color:var(--fg);font-weight:500}
.act div time{font:400 11.5px/20px var(--sans);color:var(--fg-3)}
.act .dot{width:20px;height:20px;display:grid;place-items:center;color:var(--fg-3)}
.act .dot i{width:6px;height:6px;border-radius:50%;background:var(--fg-4);box-shadow:0 0 0 3px #1a1a1d}
.md{margin:0;padding:12px 14px;border-radius:10px;background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 1px var(--line);font:400 11px/18px var(--mono);color:var(--fg-2);white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto}
.tree{padding:10px 14px;border-radius:10px;background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 1px var(--line);font:400 11.5px/20px var(--mono);color:var(--fg-2);overflow-x:auto}
.tree div{white-space:nowrap}.tree .a{color:var(--ok)}.tree .m{color:var(--p-high)}
.pub{padding:20px;display:grid;gap:20px}
.pub h3{margin:0 0 4px;font:600 15px/22px var(--sans);letter-spacing:-.01em}
.pub p{margin:0;font:400 13px/20px var(--sans);color:var(--fg-2)}
.pub section{display:grid;gap:10px}
.irow{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;align-items:center;height:40px;padding:0 12px;box-shadow:inset 0 -1px 0 var(--line);font:400 13px/1 var(--sans)}
.irow:last-child{box-shadow:none}
.irow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ilist{border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}

/* command menu */
.cmd{position:fixed;left:50%;top:16vh;translate:-50% 0;z-index:90;width:min(620px,calc(100vw - 24px));max-height:min(520px,72vh);display:flex;flex-direction:column;overflow:hidden;opacity:0;scale:.97;transition:opacity .16s var(--ease),scale .2s var(--ease);pointer-events:none}
.cmd.on{opacity:1;scale:1;pointer-events:auto}
.cmd-in{display:flex;align-items:center;gap:12px;height:54px;padding:0 16px;box-shadow:inset 0 -1px 0 var(--line);color:var(--fg-3);flex:none}
.cmd-in input{all:unset;flex:1;font:400 15px/1 var(--sans);letter-spacing:-.006em;color:var(--fg)}

    if (k === 'status') openMenu(b, { items: statusItems(e.status) }, v => { e.status = v; if (v === 'resolved') e.log.push(['resolved', now()]); touch(); renderSheet(); });
    if (k === 'sev') openMenu(b, { items: prioItems(e.sev) }, v => { e.sev = v; touch(); renderSheet(); });
    if (k === 'intent') openMenu(b, { items: intentItems(e.intent) }, v => { e.intent = v; touch(); renderSheet(); });
    if (k === 'plan') openMenu(b, { head: 'Link to the manual test plan', items: planItems(e.plan) }, v => { e.plan = v || null; touch(); renderSheet(); });
    if (k === 'tags') openMenu(b, { head: 'Tags', multi: true, items: tagItems(e.tags) }, v => { const i = e.tags.indexOf(v); i >= 0 ? e.tags.splice(i, 1) : e.tags.push(v); touch(); const s = b.querySelector('span:last-child'); if (s) s.textContent = e.tags.length ? e.tags.join(', ') : 'Add tags'; });
    if (k === 'issue') { e.issue = issueNo++; e.log.push(['issue', now()]); touch(); renderSheet(); toast(`Opened GitHub issue <b style="font-weight:500">#${e.issue}</b> for ${pid(e.id)}`); }
    if (k === 'src') copy(e.src, 'Copied ' + short(e.src));
    if (k === 'sel') copy(e.sel, 'Copied the element selector');
    if (k === 'md') { T.md = !T.md; renderSheet(); }
    if (k === 'agent') copy(md(e), `Copied ${pid(e.id)} as a prompt for an agent`);
    if (k === 'resolve') { e.status = e.status === 'resolved' ? 'open' : 'resolved'; if (e.status === 'resolved') e.log.push(['resolved', now()]); touch(); renderSheet(); toast(`${pid(e.id)} ${e.status === 'resolved' ? 'resolved' + (e.issue ? ` · closes #${e.issue}` : '') : 'reopened'}`); }
    if (k === 'show') showOnPage(e);
  });
}
function publishHTML() {
  const pend = S.entries.filter(e => !e.written);
  const iss = S.entries.filter(e => !e.issue && e.status !== 'resolved' && (e.intent === 'fix' || e.intent === 'change'));
  return `<div class="pub">
    <section><div><h3>Files</h3><p>Each entry is a markdown file in the repo, one folder per session. Commit them with your branch.</p></div>
      <div class="tree">${pend.length ? `<div class="m">~ reviews/${SESSION.slug}/session.md</div>` + pend.map(e => `<div class="a">+ entries/${pad(e.id)}-${slug(e.title)}.md</div><div class="a">+ assets/${pad(e.id)}-${e.vp}.png</div>`).join('') : '<div>Everything is written. Nothing new to commit.</div>'}</div>
      <div><button type="button" class="btn pri" id="pb-write" ${pend.length ? '' : 'aria-disabled="true"'}>${ic('file', 'ic s')}Write ${pend.length ? pend.length * 2 + 1 : 0} files</button></div></section>
    <section><div><h3>GitHub issues</h3><p>Fix and change entries can open an issue. Questions and approvals stay in the files.</p></div>
      ${iss.length ? `<div class="ilist">${iss.map(e => `<div class="irow">${prioIcon(e.sev)}<span>${esc(e.title)}</span><span class="mono" style="color:var(--fg-3)">${pid(e.id)}</span></div>`).join('')}</div>` : '<div class="empty" style="padding:20px">Every open fix and change already has an issue.</div>'}
      <div><button type="button" class="btn" id="pb-iss" ${iss.length ? '' : 'aria-disabled="true"'}>${ic('gh', 'ic s')}Open ${iss.length} issue${iss.length === 1 ? '' : 's'}</button></div></section>
  </div>`;
}
function wirePublish() {
  const w = $('#pb-write'); if (w) w.onclick = () => { const l = S.entries.filter(e => !e.written); l.forEach(e => { e.written = true; e.log.push(['written', now()]); }); renderSheet(); toast(`Wrote ${l.length * 2 + 1} files to <span class="mono">reviews/${SESSION.slug}/</span>`); };
  const i = $('#pb-iss'); if (i) i.onclick = () => { const l = S.entries.filter(e => !e.issue && e.status !== 'resolved' && (e.intent === 'fix' || e.intent === 'change')); l.forEach(e => { e.issue = issueNo++; e.written = false; e.log.push(['issue', now()]); }); renderSheet(); toast(`Opened ${l.map(e => '#' + e.issue).join(', ')}. Issue numbers are written back into each file.`); };
}
function showOnPage(e) {
  if (e.vp !== S.vp) { setVp(e.vp); toast(`Switched to ${VPS[e.vp][0].toLowerCase()}, where ${pid(e.id)} was filed`); }
  if (innerWidth < 900) closeSheet();
  setTimeout(() => { const el = e.srcs[0] && bySrc(e.srcs[0]); if (el) el.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' }); setTimeout(() => { relayout(); setTimeout(() => pulse(e.id), 40); }, 420); }, 80);
}

/* ---------- command menu ---------- */
const cmdEl = $('#cmd'), scrim = $('#scrim');
scrim.onclick = () => { if (S.cmd) closeCmd(); };
function openCmd() { if (S.comp) closeComp(); S.cmd = { q: '', i: 0 }; renderCmd(); cmdEl.classList.add('on'); scrim.classList.add('on'); cmdEl.setAttribute('aria-hidden', 'false'); syncDock(); setTimeout(() => $('#cmd-q') && $('#cmd-q').focus(), 20); }
function closeCmd() { S.cmd = null; cmdEl.classList.remove('on'); scrim.classList.remove('on'); cmdEl.setAttribute('aria-hidden', 'true'); syncDock(); }
function cmdItems() {
  const q = S.cmd.q.toLowerCase(), it = [];
  const add = (sec, icon, label, sub, right, run) => { if (!q || (label + ' ' + sub).toLowerCase().includes(q)) it.push({ sec, icon, label, sub, right, run }); };
  [['pick', 'Pick element', 'P'], ['multi', 'Select several elements', 'M'], ['area', 'Box select', 'B'], ['text', 'Quote text', 'T'], ['note', 'Page note', 'N']].forEach(([m, l, k]) => add('Review', ic(m, 'ic s'), l, `on ${VPS[S.vp][0].toLowerCase()}`, `<kbd>${k}</kbd>`, () => { closeCmd(); setMode(m); }));
  add('Review', ic('freeze', 'ic s'), S.frozen ? 'Resume motion' : 'Freeze motion', 'pause animations on the page', '<kbd>F</kbd>', () => { closeCmd(); freeze(); });
  Object.keys(VPS).forEach((v, i) => add('Viewport', ic(v, 'ic s'), VPS[v][0], VPS[v][1] ? VPS[v][1].join('×') : 'fills the window', S.vp === v ? 'Current' : `<kbd>${i + 1}</kbd>`, () => { closeCmd(); setVp(v); }));
  S.entries.filter(e => e.status !== 'resolved').slice().reverse().forEach(e => add('Entries', prioIcon(e.sev), e.title, `${pid(e.id)} · ${VPS[e.vp][0]}`, ic(e.vp, 'ic s'), () => openTicket(e.id)));
  add('Session', ic('inbox', 'ic s'), 'All entries', `${S.entries.length} in this session`, '<kbd>E</kbd>', () => { closeCmd(); S.sheet.sel = null; openSheet('entries'); });
  add('Session', ic('publish', 'ic s'), 'Publish session', `${S.entries.filter(e => !e.written).length} files to write`, '', () => { closeCmd(); S.sheet.sel = null; openSheet('publish'); });
  return it;
}
function renderCmd() {
  const items = cmdItems(); S.cmd.i = Math.min(S.cmd.i, Math.max(0, items.length - 1));
  let sec = '';
  const list = items.length ? items.map((x, i) => { const h = x.sec !== sec ? `<div class="cmd-sec">${x.sec}</div>` : ''; sec = x.sec; return `${h}<button type="button" class="cmd-it ${i === S.cmd.i ? 'kb' : ''}" data-i="${i}"><span class="ci">${x.icon}</span><span>${esc(x.label)}</span><span class="sub">${esc(x.sub)}</span><span class="r">${x.right}</span></button>`; }).join('') : `<div class="empty">Nothing matches “${esc(S.cmd.q)}”.</div>`;
  if (!$('#cmd-q')) {
    cmdEl.innerHTML = `<div class="cmd-in">${ic('search')}<input id="cmd-q" placeholder="Search tools, viewports and entries" aria-label="Search" autocomplete="off"><kbd>Esc</kbd></div><div class="cmd-ls" id="cmd-ls"></div><div class="cmd-ft"><span class="logo">${ic('logo')}</span><span class="hint">Proompter</span><span class="sp"></span><span class="hint">Navigate <kbd>↑</kbd><kbd>↓</kbd></span><span class="hint">Run <kbd>↵</kbd></span></div>`;
    const q = $('#cmd-q');
    q.oninput = () => { S.cmd.q = q.value; S.cmd.i = 0; renderCmd(); };
    q.onkeydown = ev => {
      const n = $$('.cmd-it', cmdEl).length;
      if ((ev.key === 'ArrowDown' || ev.key === 'ArrowUp') && n) { ev.preventDefault(); S.cmd.i = (S.cmd.i + (ev.key === 'ArrowDown' ? 1 : -1) + n) % n; $$('.cmd-it', cmdEl).forEach((b, j) => b.classList.toggle('kb', j === S.cmd.i)); const c = $('.cmd-it.kb', cmdEl); c && c.scrollIntoView({ block: 'nearest' }); }
      if (ev.key === 'Enter') { ev.preventDefault(); const its = cmdItems(); its[S.cmd.i] && its[S.cmd.i].run(); }
    };
  }
  $('#cmd-ls').innerHTML = list;
  $$('.cmd-it', cmdEl).forEach(b => { b.onclick = () => items[+b.dataset.i].run(); b.onpointermove = () => { if (S.cmd.i === +b.dataset.i) return; S.cmd.i = +b.dataset.i; $$('.cmd-it', cmdEl).forEach((x, j) => x.classList.toggle('kb', j === S.cmd.i)); }; });
}

/* ---------- keyboard ---------- */
function onKey(ev) {
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); S.cmd ? closeCmd() : openCmd(); return; }
  if (ev.key === 'Escape') {
    if (S.menu) return closeMenu();
    if (S.comp) return closeComp();
    if (S.cmd) return closeCmd();
    if (S.mode !== 'idle') return setMode(S.mode);
    if (S.sheet.on && S.sheet.sel) { S.sheet.sel = null; return renderSheet(); }
    if (S.sheet.on) return closeSheet();
    return;
  }
  const t = ev.target, typing = t && t.closest && t.closest('input,textarea,select,[contenteditable]');
  if (typing || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if ((S.mode === 'pick' || S.mode === 'multi') && !S.comp && hoverEl) {
    if (ev.key === 'ArrowUp' || ev.key === '[') { ev.preventDefault(); walkUp(); return; }
    if (ev.key === 'ArrowDown' || ev.key === ']') { ev.preventDefault(); walkDown(); return; }
  }
  const k = ev.key.toLowerCase(), map = { p: 'pick', m: 'multi', b: 'area', t: 'text', n: 'note' };
  if (map[k]) { ev.preventDefault(); if (S.col) setCollapsed(false); setMode(map[k]); }
  else if (k === 'f') freeze();
  else if (k === 'r') rotate();
  else if (k === 'e') S.sheet.on ? closeSheet() : openSheet();
  else if (['1', '2', '3', '4'].includes(k)) setVp(Object.keys(VPS)[+k - 1]);
}
document.addEventListener('keydown', onKey);
window.__proompter = { open: () => dock.focus(), entries: () => S.entries.slice() };

seed(); boot(); if (S.col) { dock.classList.add('col'); $('#brand').setAttribute('aria-expanded', 'false'); $('#brand').setAttribute('aria-label', 'Expand toolbar'); } applyDock(); syncDock(); layoutStage();
})();
</script>
